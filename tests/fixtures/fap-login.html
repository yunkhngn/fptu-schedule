<!DOCTYPE html>
<html lang="vi">
 <head>
  <meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
  <title>
   Log In | Fap Fpt Education
  </title>
  <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
  <meta content="Hệ thống quản lý đào tạo trường đại học fpt" name="description"/>
  <meta content="#0e2a47" name="theme-color"/>
  <link href="https://fap.fpt.edu.vn/favicon.ico?v=G2XWYR_Fhb79HpwJRmFa0uwCiv9MUmuzKlfpdiSr3ZQ" rel="shortcut icon"/>
 </head>
 <body class="authentication-bg position-relative">
  <div aria-hidden="true" class="login-auth-backdrop">
  </div>
  <div class="account-pages pt-2 pt-sm-5 pb-4 pb-sm-5 position-relative">
   <div class="container">
    <div class="row justify-content-center">
     <div class="col-xxl-4 col-lg-5">
      <div class="card">
       <!-- Logo -->
       <div class="card-header pt-4 text-center">
        <div class="auth-brand mb-0">
         <a class="logo-dark" href="https://fap.fpt.edu.vn/">
          <span>
           <img alt="dark logo" height="75" src="https://fap.fpt.edu.vn/assets/images/logo-fptu.png"/>
          </span>
         </a>
         <a class="logo-light" href="https://fap.fpt.edu.vn/">
          <span>
           <img alt="logo" height="75" src="https://fap.fpt.edu.vn/assets/images/logo-fptu.png"/>
          </span>
         </a>
        </div>
       </div>
       <div class="card-body p-4">
        <div class="d-none" id="login-antiforgery">
        </div>
        <div class="text-center w-75 m-auto mb-3">
         <h4 class="text-dark-50 text-center pb-0 mb-1">
          Hệ thống quản lý đào tạo
         </h4>
         <p class="text-muted mb-0 small">
          Đăng nhập
         </p>
        </div>
        <div id="login-step-credentials">
         <div class="login-role-tabs mb-3" data-force-tab="" data-storage-key="fap.login.activeTab" id="login-card-tabs">
          <ul class="nav nav-pills nav-justified w-100" role="tablist">
           <li class="nav-item" role="presentation">
            <button aria-controls="tab-staff-student" aria-selected="true" class="nav-link w-100 active" data-bs-target="#tab-staff-student" data-bs-toggle="tab" id="login-tab-staff-btn" role="tab" type="button">
             Cán bộ &amp; Sinh viên
            </button>
           </li>
           <li class="nav-item" role="presentation">
            <button aria-controls="tab-parent" aria-selected="false" class="nav-link w-100" data-bs-target="#tab-parent" data-bs-toggle="tab" id="login-tab-parent-btn" role="tab" tabindex="-1" type="button">
             Phụ huynh
            </button>
           </li>
          </ul>
         </div>
         <div class="tab-content">
          <div aria-labelledby="login-tab-staff-btn" class="tab-pane fade show active" id="tab-staff-student" role="tabpanel">
           <p class="text-center text-muted small mb-3 mb-md-4 lh-sm px-1">
            Đăng nhập dành cho cán bộ và sinh viên
           </p>
           <div class="d-grid gap-2">
            <a class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2" data-href="/Auth/GoogleLogin" data-return-url="/" href="https://fap.fpt.edu.vn/Auth/Login?ReturnUrl=%2F#" id="login-google-link">
             <svg aria-hidden="true" fill="currentColor" height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
              <path d="M0 0h24v24H0z" fill="none" stroke="none">
              </path>
              <path d="M12 2a9.96 9.96 0 0 1 6.29 2.226a1 1 0 0 1 .04 1.52l-1.51 1.362a1 1 0 0 1 -1.265 .06a6 6 0 1 0 2.103 6.836l.001 -.004h-3.66a1 1 0 0 1 -.992 -.883l-.007 -.117v-2a1 1 0 0 1 1 -1h6.945a1 1 0 0 1 .994 .89c.04 .367 .061 .737 .061 1.11c0 5.523 -4.477 10 -10 10s-10 -4.477 -10 -10s4.477 -10 10 -10z">
              </path>
             </svg>
             Đăng nhập với Google
            </a>
            <a class="btn btn-primary w-100" data-href="/Auth/FeidLogin" data-return-url="/" href="https://fap.fpt.edu.vn/Auth/Login?ReturnUrl=%2F#" id="login-feid-link">
             Đăng nhập với FeID
            </a>
           </div>
          </div>
          <div aria-labelledby="login-tab-parent-btn" class="tab-pane fade" id="tab-parent" role="tabpanel">
           <p class="text-center text-muted small mb-3 mb-md-4 lh-sm px-1">
            Đăng nhập dành cho phụ huynh
           </p>
           <form action="https://fap.fpt.edu.vn/Auth/LoginParent" data-recaptcha-site-key="" id="frm-parent-login" method="post">
            <div class="mb-3">
             <label class="form-label" for="Username">
              Tên đăng nhập
             </label>
             <input class="form-control" data-val="true" data-val-required="Vui lòng nhập tên đăng nhập" id="Username" name="Username" placeholder="Nhập tên đăng nhập" type="text" value=""/>
             <span class="text-danger field-validation-valid" data-valmsg-for="Username" data-valmsg-replace="true">
             </span>
            </div>
            <div class="mb-3">
             <label class="form-label" for="Password">
              Mật khẩu
             </label>
             <div class="input-group input-group-merge">
              <input autocomplete="current-password" class="form-control" data-val="true" data-val-required="Vui lòng nhập mật khẩu" id="Password" name="Password" placeholder="Nhập mật khẩu" type="password"/>
              <div class="input-group-text" data-password="false">
               <span class="password-eye">
               </span>
              </div>
             </div>
             <span class="text-danger field-validation-valid" data-valmsg-for="Password" data-valmsg-replace="true">
             </span>
            </div>
            <div class="mb-0 text-center">
             <button class="btn btn-primary" type="submit">
              Đăng nhập
             </button>
            </div>
           </form>
          </div>
         </div>
        </div>
        <!-- /login-step-credentials -->
       </div>
       <!-- end card-body -->
      </div>
      <!-- end card -->
     </div>
     <!-- end col -->
    </div>
    <!-- end row -->
   </div>
   <!-- end container -->
  </div>
  <!-- end page -->
 </body>
</html>
